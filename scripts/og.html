<!doctype html>
<!-- Source for public/og.png (1200×630). Regenerate with scripts/make-og.sh -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;background:radial-gradient(60% 70% at 78% 30%,rgba(92,134,240,.16),transparent 70%),radial-gradient(45% 55% at 92% 85%,rgba(240,64,95,.14),transparent 70%),radial-gradient(120% 90% at 50% 0%,#0d1220 0%,#05070c 70%);color:#e9ecf1;font-family:Geist,system-ui,sans-serif;overflow:hidden}
  .field{position:absolute;inset:0}
  .wrap{position:absolute;inset:0;padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between}
  .k{font:500 18px "Geist Mono",monospace;letter-spacing:.04em;text-transform:uppercase;color:#7e8899}
  h1{margin:18px 0 0;font-size:66px;line-height:1.02;letter-spacing:-.04em;font-weight:600;max-width:900px}
  h1 span{color:#7e8899}
  .row{display:flex;gap:56px;border-top:1.5px solid #353d4d;padding-top:22px}
  .row b{display:block;font-size:40px;letter-spacing:-.03em;font-weight:600}
  .row i{display:block;font-style:normal;font-size:17px;color:#b0b8c5;max-width:300px;margin-top:4px;line-height:1.35}
</style></head>
<body>
<svg class="field" width="1200" height="630" id="f"></svg>
<div class="wrap">
  <div>
    <div class="k">Rahul Aditya Butta · Machine Learning Engineer</div>
    <h1>I build ML that holds up in production, <span>and go down to the kernel.</span></h1>
  </div>
  <div class="row">
    <div><b>5 of 5</b><i>later OIG exclusions already in the top 0.53% risk tier</i></div>
    <div><b>+6.3%</b><i>perplexity vs full KV cache at constant memory</i></div>
    <div><b>85–89%</b><i>of peak DRAM bandwidth, fused RMSNorm in Triton</i></div>
  </div>
</div>
<script>
  // Seeded starfield streaking out from a vanishing point on the right.
  let seed=7;const r=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const vp=[960,250];let h='';
  for(let i=0;i<520;i++){const x=r()*1200,y=r()*630,d=Math.hypot(x-vp[0],y-vp[1]),k=Math.min(1,d/700),a=(0.25+0.75*r())*(0.4+0.6*k);
    if(r()<0.22){const l=6+k*34;const ux=(x-vp[0])/(d||1),uy=(y-vp[1])/(d||1);h+=`<line x1="${x-ux*l}" y1="${y-uy*l}" x2="${x}" y2="${y}" stroke="#fff" stroke-opacity="${(a*0.7).toFixed(2)}" stroke-width="${(0.6+k).toFixed(2)}"/>`;}
    else h+=`<circle cx="${x}" cy="${y}" r="${(0.4+r()*1.3*k).toFixed(2)}" fill="#fff" fill-opacity="${a.toFixed(2)}"/>`;}
  document.getElementById('f').innerHTML=h;
</script>
</body></html>
